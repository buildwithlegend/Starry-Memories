<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給妳的浪漫星空膠捲</title>
    <!-- 引入 Google Fonts 中文字型與圖示 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #050b14;
            --bg-night: #0a1628;
            --gold-primary: #f0c674;
            --gold-light: #fffaed;
            --gold-glow: rgba(240, 198, 116, 0.4);
            --text-main: #f4f4f4;
            --text-muted: #b0bac9;
            --letter-bg: rgba(10, 22, 40, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Noto Serif TC', serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #sky-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* 密碼解鎖畫面 */
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 11, 20, 0.96);
            z-index: 300;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(15px);
            transition: opacity 0.8s ease;
        }

        .auth-box {
            background: rgba(10, 22, 40, 0.85);
            border: 1px solid rgba(240, 198, 116, 0.4);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 20px var(--gold-glow);
        }

        .auth-box i {
            font-size: 32px;
            color: var(--gold-primary);
            margin-bottom: 15px;
        }

        .auth-box h2 {
            font-family: 'Playfair Display', serif;
            color: var(--gold-primary);
            font-size: 22px;
            margin-bottom: 10px;
        }

        .auth-box p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .auth-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(240, 198, 116, 0.3);
            border-radius: 30px;
            padding: 12px 20px;
            color: var(--gold-light);
            font-size: 16px;
            text-align: center;
            letter-spacing: 3px;
            outline: none;
            margin-bottom: 20px;
            font-family: 'Playfair Display', serif;
        }

        .auth-input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px var(--gold-glow);
        }

        .auth-btn {
            width: 100%;
            background: var(--gold-primary);
            border: none;
            color: var(--bg-deep);
            padding: 12px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Noto Serif TC', serif;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .auth-btn:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
        }

        #auth-error {
            color: #ff8080;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        /* 主內容區域 */
        #reel-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 80px 20px 200px 20px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        #reel-container.active {
            opacity: 1;
            transform: translateY(0);
        }

        .reel-item {
            background: rgba(10, 22, 40, 0.7);
            border: 1px solid rgba(240, 198, 116, 0.3);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 120px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            opacity: 0;
            transform: scale(0.95);
            filter: blur(5px);
            transition: opacity 1.5s ease, transform 1.5s ease, filter 1.5s ease;
        }

        .reel-item.visible {
            opacity: 1;
            transform: scale(1);
            filter: blur(0);
        }

        .reel-img-wrap {
            width: 100%;
            height: auto;
            max-height: 75vh;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(240, 198, 116, 0.2);
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reel-img-wrap img {
            width: 100%;
            height: auto;
            max-height: 75vh;
            object-fit: contain;
            display: block;
            transition: transform 0.5s ease;
        }

        .reel-item:hover .reel-img-wrap img {
            transform: scale(1.02);
        }

        .reel-text h3 {
            color: var(--gold-primary);
            font-size: 22px;
            margin-bottom: 10px;
            font-family: 'Playfair Display', serif;
        }

        .reel-text p {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.8;
        }

        #final-letter {
            opacity: 0;
            transform: translateY(50px);
            border: 1px solid rgba(240, 198, 116, 0.5);
            background: var(--letter-bg);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 0 30px var(--gold-glow);
            transition: opacity 2s ease, transform 2s ease;
            position: relative;
            z-index: 15;
        }

        #final-letter.show {
            opacity: 1;
            transform: translateY(0);
        }

        #final-letter .icon-wrap {
            font-size: 30px;
            color: var(--gold-primary);
            margin-bottom: 15px;
        }

        #final-letter h2 {
            font-family: 'Playfair Display', serif;
            color: var(--gold-primary);
            font-size: 24px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        #final-letter-content {
            color: var(--gold-light);
            font-size: 16px;
            line-height: 2;
            font-weight: 300;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <canvas id="sky-canvas"></canvas>

    <!-- 密碼驗證遮罩層 -->
    <div id="auth-overlay">
        <div class="auth-box">
            <i class="fa-solid fa-lock"></i>
            <h2>星空記憶解鎖</h2>
            <p>請輸入專屬於我們的密碼，開啟這段回憶旅程</p>
            <input type="password" id="password-input" class="auth-input" placeholder="請輸入密碼">
            <button id="auth-submit-btn" class="auth-btn">進入星空</button>
            <div id="auth-error">密碼錯誤，請重新輸入</div>
        </div>
    </div>

    <!-- 回憶膠捲容器 -->
    <div id="reel-container"></div>

    <audio id="bg-music" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-serene-view-443.mp3" type="audio/mpeg">
    </audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDfEnsCez2ywbt0NQ4jPBUUr8oAIcIwyA0",
            authDomain: "account-management-dashb-b4373.firebaseapp.com",
            databaseURL: "https://account-management-dashb-b4373-default-rtdb.firebaseio.com",
            projectId: "account-management-dashb-b4373",
            storageBucket: "account-management-dashb-b4373.firebasestorage.app",
            messagingSenderId: "294482078870",
            appId: "1:294482078870:web:bb21cd0fb8eabf3a5f26b7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let storyData = [];
        let finalLetterText = "在熙攘的百貨與寂靜的星空下，我學會了如何把平凡的日子過成詩。\n願我們牽著手，繼續走過季節的百貨，走過未來的每一天。\n\n餘生，請多多指教 ❤️";

        async function loadStoryFromFirebase() {
            try {
                const docRef = doc(db, "confessions", "mainStory");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().items) {
                    storyData = docSnap.data().items;
                    finalLetterText = docSnap.data().finalLetter || finalLetterText;
                }
            } catch (error) {
                console.log("載入雲端資料失敗:", error);
            } finally {
                renderReel();
            }
        }

        const reelContainer = document.getElementById('reel-container');
        function renderReel() {
            reelContainer.innerHTML = '';
            storyData.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'reel-item';
                div.innerHTML = `
                    <div class="reel-img-wrap"><img src="${item.img}" alt="Memory" onerror="this.src='https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=800'"></div>
                    <div class="reel-text"><h3>${item.title}</h3><p>${item.desc}</p></div>
                `;
                reelContainer.appendChild(div);
            });
            const letterDiv = document.createElement('div');
            letterDiv.id = 'final-letter';
            letterDiv.innerHTML = `
                <div class="icon-wrap"><i class="fa-solid fa-moon"></i></div>
                <h2>通往未來的約定</h2>
                <p id="final-letter-content">${finalLetterText}</p>
            `;
            reelContainer.appendChild(letterDiv);
        }

        loadStoryFromFirebase();
    </script>

    <script>
        const canvas = document.getElementById('sky-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const stars = Array.from({length: 150}, () => ({
            x: Math.random() * width, y: Math.random() * height,
            radius: Math.random() * 1.5, alpha: Math.random(), speed: Math.random() * 0.01 + 0.005
        }));

        const candles = Array.from({length: 20}, () => ({
            x: Math.random() * width, y: height + Math.random() * 200,
            radius: Math.random() * 3 + 1, speed: Math.random() * 0.8 + 0.4, alpha: Math.random() * 0.6 + 0.2
        }));

        const scatteringStars = Array.from({length: 100}, () => ({
            x: Math.random() * width, y: -200 - Math.random() * 500,
            radius: Math.random() * 3 + 1.5, speed: Math.random() * 3 + 2, alpha: 1
        }));

        let openingScatteringFinished = false;

        function drawSky() {
            ctx.clearRect(0, 0, width, height);
            let gradient = ctx.createRadialGradient(width/2, height/2, 50, width/2, height/2, Math.max(width, height));
            gradient.addColorStop(0, '#0e1f38');
            gradient.addColorStop(1, '#050b14');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0.2) s.speed = -s.speed;
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2); ctx.fill();
            });

            candles.forEach(c => {
                c.y -= c.speed;
                if (c.y < -10) { c.y = height + 10; c.x = Math.random() * width; }
                ctx.fillStyle = `rgba(240, 198, 116, ${c.alpha})`;
                ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2); ctx.fill();
            });

            if (!openingScatteringFinished) {
                scatteringStars.forEach(s => {
                    s.y += s.speed;
                    s.alpha *= 0.985;
                    ctx.fillStyle = `rgba(240, 198, 116, ${s.alpha})`;
                    ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2); ctx.fill();
                });
                if (scatteringStars.every(s => s.alpha < 0.05)) {
                    openingScatteringFinished = true;
                }
            }
            requestAnimationFrame(drawSky);
        }
        drawSky();

        // 密碼解鎖互動邏輯
        const authOverlay = document.getElementById('auth-overlay');
        const passwordInput = document.getElementById('password-input');
        const authSubmitBtn = document.getElementById('auth-submit-btn');
        const authError = document.getElementById('auth-error');
        const reelContainerElem = document.getElementById('reel-container');
        const bgMusic = document.getElementById('bg-music');

        function handleUnlock() {
            const enteredPwd = passwordInput.value.trim();
            if (enteredPwd === "1150829") {
                authOverlay.style.opacity = '0';
                setTimeout(() => {
                    authOverlay.style.display = 'none';
                    reelContainerElem.classList.add('active');
                    // 解鎖成功後自動播放音樂
                    bgMusic.play().catch(() => {});
                }, 800);
            } else {
                authError.style.display = 'block';
                passwordInput.style.borderColor = '#ff8080';
            }
        }

        authSubmitBtn.addEventListener('click', handleUnlock);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleUnlock();
        });

        // 滾動時自動浮現照片與告白信
        window.addEventListener('scroll', () => {
            const items = document.querySelectorAll('.reel-item, #final-letter');
            items.forEach(item => {
                const rect = item.getBoundingClientRect();
                if (rect.top < window.innerHeight * 0.85 && rect.bottom > 0) {
                    item.classList.add('visible');
                    if (item.id === 'final-letter') {
                        item.classList.add('show');
                    }
                }
            });
        });
    </script>
</body>
</html>
