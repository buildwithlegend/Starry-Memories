<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給妳的浪漫星空膠捲</title>
    <!-- 引入 Google Fonts 中文字型與圖示 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #050b14;
            --bg-night: #0a1628;
            --gold-primary: #f0c674;
            --gold-light: #fffaed;
            --gold-glow: rgba(240, 198, 116, 0.4);
            --text-main: #f4f4f4;
            --text-muted: #b0bac9;
            --letter-bg: rgba(10, 22, 40, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Noto Serif TC', serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #sky-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .top-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 12px;
            opacity: 0; /* 初始隱藏，動畫後浮現 */
            animation: fadeIn 2s ease forwards 4.5s;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .control-btn {
            background: rgba(10, 22, 40, 0.85);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Noto Serif TC', serif;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .control-btn:hover {
            background: var(--gold-primary);
            color: var(--bg-deep);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        #reel-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 150px 20px 250px 20px;
            opacity: 0;
            transform: translateY(30px);
            animation: startReel 1.5s ease forwards 4s;
        }

        @keyframes startReel {
            to { opacity: 1; transform: translateY(0); }
        }

        .reel-item {
            background: rgba(10, 22, 40, 0.7);
            border: 1px solid rgba(240, 198, 116, 0.3);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 120px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            opacity: 0; /* 初始隱藏 */
            transform: scale(0.95); /* 初始縮小 */
            filter: blur(5px); /* 初始模糊 */
            transition: opacity 1.5s ease, transform 1.5s ease, filter 1.5s ease;
        }

        .reel-item.visible {
            opacity: 1;
            transform: scale(1);
            filter: blur(0);
        }

        .reel-img-wrap {
            width: 100%;
            height: 380px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid rgba(240, 198, 116, 0.2);
            background: #000;
        }

        .reel-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .reel-item:hover .reel-img-wrap img {
            transform: scale(1.03);
        }

        .reel-text h3 {
            color: var(--gold-primary);
            font-size: 22px;
            margin-bottom: 10px;
            font-family: 'Playfair Display', serif;
        }

        .reel-text p {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.8;
        }

        #final-letter {
            opacity: 0;
            transform: translateY(50px);
            border: 1px solid rgba(240, 198, 116, 0.5);
            background: var(--letter-bg);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 0 30px var(--gold-glow);
            transition: opacity 2s ease, transform 2s ease;
            position: relative;
            z-index: 15;
        }

        #final-letter.show {
            opacity: 1;
            transform: translateY(0);
        }

        #final-letter .icon-wrap {
            font-size: 30px;
            color: var(--gold-primary);
            margin-bottom: 15px;
        }

        #final-letter h2 {
            font-family: 'Playfair Display', serif;
            color: var(--gold-primary);
            font-size: 24px;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        #final-letter-content {
            color: var(--gold-light);
            font-size: 16px;
            line-height: 2;
            font-weight: 300;
            white-space: pre-wrap; /* 保持換行 */
        }

        #player-bar {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(10, 22, 40, 0.9);
            border: 1px solid var(--gold-primary);
            padding: 12px 25px;
            border-radius: 40px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 25px rgba(0,0,0,0.7);
            transition: transform 0.5s ease, opacity 0.5s ease;
            opacity: 0;
            animation: fadeIn 2s ease forwards 4.5s;
        }

        #player-bar.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .player-btn {
            background: none;
            border: none;
            color: var(--gold-primary);
            font-size: 18px;
            cursor: pointer;
        }

        .speed-badge {
            font-size: 13px;
            color: var(--text-muted);
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #custom-panel {
            position: fixed;
            top: 0;
            right: -420px;
            width: 420px;
            height: 100%;
            background: rgba(8, 16, 30, 0.98);
            border-left: 1px solid var(--gold-primary);
            z-index: 200;
            padding: 30px;
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            transition: right 0.4s ease;
            overflow-y: auto;
        }

        #custom-panel.open {
            right: 0;
        }

        #custom-panel h2 {
            color: var(--gold-primary);
            font-size: 20px;
            margin-bottom: 20px;
            font-family: 'Playfair Display', serif;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(240, 198, 116, 0.3);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-main);
            font-family: 'Noto Serif TC', serif;
            font-size: 14px;
        }

        .form-group textarea {
            height: 70px;
            resize: vertical;
        }

        .close-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .delete-card-btn {
            background: rgba(255, 80, 80, 0.15);
            border: 1px solid rgba(255, 80, 80, 0.4);
            color: #ff8080;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            float: right;
        }
        .delete-card-btn:hover {
            background: rgba(255, 80, 80, 0.3);
        }

        #loading-mask {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 250;
            justify-content: center;
            align-items: center;
            color: var(--gold-primary);
            font-size: 16px;
        }
    </style>
</head>
<body>

    <canvas id="sky-canvas"></canvas>

    <div class="top-bar">
        <button class="control-btn" id="music-toggle-btn"><i class="fa-solid fa-music"></i> 音樂：關</button>
        <button class="control-btn" id="open-config-btn"><i class="fa-solid fa-pen-to-square"></i> 自訂內容 (管理員)</button>
    </div>

    <div id="reel-container"></div>

    <div id="player-bar">
        <button class="player-btn" id="play-pause-btn" title="暫停/播放"><i class="fa-solid fa-pause"></i></button>
        <span style="font-size:13px; color:var(--gold-primary);" id="player-status">自動放映中...</span>
        <button class="speed-badge" id="speed-btn">速度: 1x</button>
    </div>

    <div id="custom-panel">
        <div id="loading-mask">同步雲端儲存中...</div>
        <button class="close-panel" id="close-config-btn"><i class="fa-solid fa-xmark"></i></button>
        <h2>編輯回憶膠捲內容</h2>
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">提示：請將 <a href="https://imgbb.com/" target="_blank" style="color: var(--gold-primary);">ImgBB</a> 的「直接連結」貼至照片欄位。</p>
        
        <div id="form-items-container"></div>
        
        <button class="control-btn" id="add-card-btn" style="width:100%; justify-content:center; margin-bottom: 15px; background: rgba(240,198,116,0.1);">
            <i class="fa-solid fa-plus"></i> 新增一張卡片
        </button>

        <div class="form-group" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;">
            <label>告白信內容 (最後的驚喜)</label>
            <textarea id="input-final-letter-text" style="height: 120px;"></textarea>
        </div>

        <button class="control-btn" id="save-config-btn" style="width:100%; justify-content:center; background: var(--gold-primary); color: var(--bg-deep); font-weight: 600;">
            <i class="fa-solid fa-cloud-arrow-up"></i> 儲存並同步至雲端
        </button>
    </div>

    <audio id="bg-music" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-serene-view-443.mp3" type="audio/mpeg">
    </audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDfEnsCez2ywbt0NQ4jPBUUr8oAIcIwyA0",
            authDomain: "account-management-dashb-b4373.firebaseapp.com",
            databaseURL: "https://account-management-dashb-b4373-default-rtdb.firebaseio.com",
            projectId: "account-management-dashb-b4373",
            storageBucket: "account-management-dashb-b4373.firebasestorage.app",
            messagingSenderId: "294482078870",
            appId: "1:294482078870:web:bb21cd0fb8eabf3a5f26b7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let storyData = [];
        let finalLetterText = "在熙攘的百貨與寂靜的星空下，我學會了如何把平凡的日子過成詩。\n願我們牽著手，繼續走過季節的百貨，走過未來的每一天。\n\n餘生，請多多指教 ❤️";

        async function loadStoryFromFirebase() {
            try {
                const docRef = doc(db, "confessions", "mainStory");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().items) {
                    storyData = docSnap.data().items;
                    finalLetterText = docSnap.data().finalLetter || finalLetterText;
                }
            } catch (error) {
                console.log("載入雲端資料失敗:", error);
            } finally {
                renderReel();
            }
        }

        // 從面板介面收集目前所有欄位資料
        function collectFormData() {
            const cards = document.querySelectorAll('.card-form-item');
            let newData = [];
            cards.forEach((card, index) => {
                const imgVal = card.querySelector('.input-img').value;
                const titleVal = card.querySelector('.input-title').value;
                const descVal = card.querySelector('.input-desc').value;
                newData.push({ img: imgVal, title: titleVal, desc: descVal });
            });
            const letterVal = document.getElementById('input-final-letter-text').value;
            return { items: newData, finalLetter: letterVal };
        }

        // 儲存至雲端
        document.getElementById('save-config-btn').addEventListener('click', async () => {
            const loadingMask = document.getElementById('loading-mask');
            loadingMask.style.display = 'flex';

            try {
                const { items, finalLetter } = collectFormData();
                await setDoc(doc(db, "confessions", "mainStory"), { items, finalLetter });
                
                storyData = items;
                finalLetterText = finalLetter;
                renderReel();
                document.getElementById('custom-panel').classList.remove('open');
                alert("恭喜！所有卡片與內容已成功同步儲存至雲端！");
            } catch (err) {
                alert("儲存失敗，請檢查網路或 Firebase 設定：" + err.message);
            } finally {
                loadingMask.style.display = 'none';
            }
        });

        // 畫面渲染膠捲
        const reelContainer = document.getElementById('reel-container');
        function renderReel() {
            reelContainer.innerHTML = '';
            storyData.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'reel-item';
                div.innerHTML = `
                    <div class="reel-img-wrap"><img src="${item.img}" alt="Memory" onerror="this.src='https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=800'"></div>
                    <div class="reel-text"><h3>${item.title}</h3><p>${item.desc}</p></div>
                `;
                reelContainer.appendChild(div);
            });
            // 渲染最後的浪漫告白
            const letterDiv = document.createElement('div');
            letterDiv.id = 'final-letter';
            letterDiv.innerHTML = `
                <div class="icon-wrap"><i class="fa-solid fa-moon"></i></div>
                <h2>通往未來的約定</h2>
                <p id="final-letter-content">${finalLetterText}</p>
            `;
            reelContainer.appendChild(letterDiv);
        }

        // 渲染管理面板表單
        window.populateForm = function() {
            const container = document.getElementById('form-items-container');
            container.innerHTML = '';
            storyData.forEach((item, index) => {
                appendCardForm(item.img, item.title, item.desc, index);
            });
            document.getElementById('input-final-letter-text').value = finalLetterText;
        };

        function appendCardForm(img = '', title = '', desc = '', index) {
            const container = document.getElementById('form-items-container');
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card-form-item';
            cardDiv.style.cssText = "border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 15px;";
            cardDiv.innerHTML = `
                <div style="margin-bottom:8px; overflow:hidden;">
                    <span style="font-size:14px; color:var(--gold-primary);">卡片項目</span>
                    <button type="button" class="delete-card-btn" onclick="this.parentElement.parentElement.remove()"><i class="fa-solid fa-trash"></i> 刪除</button>
                </div>
                <div class="form-group">
                    <label>照片網址 (URL)</label>
                    <input type="text" class="input-img" value="${img}">
                </div>
                <div class="form-group">
                    <label>標題</label>
                    <input type="text" class="input-title" value="${title}">
                </div>
                <div class="form-group">
                    <label>內文描述</label>
                    <textarea class="input-desc">${desc}</textarea>
                </div>
            `;
            container.appendChild(cardDiv);
        }

        // 點擊「新增一張卡片」按鈕
        document.getElementById('add-card-btn').addEventListener('click', () => {
            if (document.querySelectorAll('.card-form-item').length > 0) {
                const { items, finalLetter } = collectFormData();
                storyData = items;
                finalLetterText = finalLetter;
            }
            storyData.push({ img: "", title: "新的回憶", desc: "請輸入這段回憶的描述..." });
            window.populateForm();
        });

        loadStoryFromFirebase();
    </script>

    <script>
        const canvas = document.getElementById('sky-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const stars = Array.from({length: 150}, () => ({
            x: Math.random() * width, y: Math.random() * height,
            radius: Math.random() * 1.5, alpha: Math.random(), speed: Math.random() * 0.01 + 0.005
        }));

        const candles = Array.from({length: 20}, () => ({
            x: Math.random() * width, y: height + Math.random() * 200,
            radius: Math.random() * 3 + 1, speed: Math.random() * 0.8 + 0.4, alpha: Math.random() * 0.6 + 0.2
        }));

        // 開場撒落的星光
        const scatteringStars = Array.from({length: 100}, () => ({
            x: Math.random() * width, y: -200 - Math.random() * 500,
            radius: Math.random() * 3 + 1.5, speed: Math.random() * 3 + 2, alpha: 1
        }));

        let openingScatteringFinished = false;

        function drawSky() {
            ctx.clearRect(0, 0, width, height);
            let gradient = ctx.createRadialGradient(width/2, height/2, 50, width/2, height/2, Math.max(width, height));
            gradient.addColorStop(0, '#0e1f38');
            gradient.addColorStop(1, '#050b14');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // 繪製靜態繁星
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0.2) s.speed = -s.speed;
                ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
                ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2); ctx.fill();
            });

            // 繪製燭光上升
            candles.forEach(c => {
                c.y -= c.speed;
                if (c.y < -10) { c.y = height + 10; c.x = Math.random() * width; }
                ctx.fillStyle = `rgba(240, 198, 116, ${c.alpha})`;
                ctx.beginPath(); ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2); ctx.fill();
            });

            // 繪製開場撒落的星光（只在初始播放一次）
            if (!openingScatteringFinished) {
                scatteringStars.forEach(s => {
                    s.y += s.speed;
                    s.alpha *= 0.985; // 慢慢淡出
                    ctx.fillStyle = `rgba(240, 198, 116, ${s.alpha})`;
                    ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2); ctx.fill();
                });
                if (scatteringStars.every(s => s.alpha < 0.05)) {
                    openingScatteringFinished = true;
                }
            }
            requestAnimationFrame(drawSky);
        }
        drawSky();

        const reelContainerElem = document.getElementById('reel-container');
        const playerBar = document.getElementById('player-bar');
        const bgMusic = document.getElementById('bg-music');
        const musicToggleBtn = document.getElementById('music-toggle-btn');
        let isPlayingAuto = false, scrollSpeed = 0.5, animationFrameId = null;

        // 頁面加載後直接開始浪漫旅程
        window.addEventListener('load', () => {
            reelContainerElem.classList.add('active');
            playerBar.classList.add('show');
            // 嘗試自動播放音樂（部分瀏覽器可能會攔截）
            bgMusic.play().then(() => musicToggleBtn.innerHTML = `<i class="fa-solid fa-music"></i> 音樂：開`).catch(() => {});
            isPlayingAuto = true;
            setTimeout(startAutoScroll, 4500); // 在開場動畫後開始放映
        });

        function startAutoScroll() {
            if (!isPlayingAuto) return;
            window.scrollBy(0, scrollSpeed);
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 5) {
                isPlayingAuto = false;
                document.getElementById('play-pause-btn').innerHTML = `<i class="fa-solid fa-play"></i>`;
                document.getElementById('player-status').innerText = '放映結束';
                return;
            }
            
            // 核心邏輯：控制照片、文字與告白信慢慢浮現
            const items = document.querySelectorAll('.reel-item, #final-letter');
            items.forEach(item => {
                const rect = item.getBoundingClientRect();
                if (rect.top < window.innerHeight * 0.85 && rect.bottom > 0) {
                    item.classList.add('visible');
                    // 如果播到最後一張照片後面，浮現終極告白信
                    if (item.id === 'final-letter') {
                        item.classList.add('show');
                        document.getElementById('player-status').innerText = '致 唯一的妳';
                    }
                }
            });
            animationFrameId = requestAnimationFrame(startAutoScroll);
        }

        document.getElementById('play-pause-btn').addEventListener('click', () => {
            isPlayingAuto = !isPlayingAuto;
            if (isPlayingAuto) {
                document.getElementById('play-pause-btn').innerHTML = `<i class="fa-solid fa-pause"></i>`;
                document.getElementById('player-status').innerText = '自動放映中...';
                startAutoScroll();
            } else {
                document.getElementById('play-pause-btn').innerHTML = `<i class="fa-solid fa-play"></i>`;
                document.getElementById('player-status').innerText = '已暫停';
                cancelAnimationFrame(animationFrameId);
            }
        });

        const speeds = [0.3, 0.6, 1.2]; let speedIdx = 0;
        document.getElementById('speed-btn').addEventListener('click', () => {
            speedIdx = (speedIdx + 1) % speeds.length;
            scrollSpeed = speeds[speedIdx];
            document.getElementById('speed-btn').innerText = `速度: ${['0.5x', '1x', '2x'][speedIdx]}`;
        });

        musicToggleBtn.addEventListener('click', () => {
            if (bgMusic.paused) { bgMusic.play(); musicToggleBtn.innerHTML = `<i class="fa-solid fa-music"></i> 音樂：開`; }
            else { bgMusic.pause(); musicToggleBtn.innerHTML = `<i class="fa-solid fa-music"></i> 音樂：關`; }
        });

        document.getElementById('open-config-btn').addEventListener('click', () => {
            document.getElementById('custom-panel').classList.add('open');
            window.populateForm();
        });
        document.getElementById('close-config-btn').addEventListener('click', () => {
            document.getElementById('custom-panel').classList.remove('open');
        });
    </script>
</body>
</html>
